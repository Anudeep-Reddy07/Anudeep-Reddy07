name: Update Activity Graph

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate charts
        env:
          GH_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from datetime import date, datetime, timedelta, timezone

          q="""query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}"""
          body=json.dumps({"query":q,"variables":{"login":os.environ["USERNAME"]}}).encode()
          req=urllib.request.Request("https://api.github.com/graphql",data=body,headers={
              "Authorization":"Bearer "+os.environ["GH_TOKEN"],
              "Content-Type":"application/json","User-Agent":"github-actions"})
          with urllib.request.urlopen(req) as r: data=json.load(r)
          if data.get("errors"): raise RuntimeError(data["errors"])

          cal=data["data"]["user"]["contributionsCollection"]["contributionCalendar"]
          days=[d for w in cal["weeks"] for d in w["contributionDays"]][-365:]
          counts=[d["contributionCount"] for d in days]
          max_count=max(counts or [1])
          total=cal["totalContributions"]
          active=sum(x>0 for x in counts)

          W,H=1160,350
          L,R,T,B=82,28,76,58
          PW,PH=W-L-R,H-T-B
          slot=PW/len(days)
          bar=max(1.5,slot*0.68)
          base=T+PH

          def esc(s):
              return s.replace("&","&amp;").replace("<","&lt;").replace(">","&gt;").replace('"',"&quot;")

          out=[
            f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img" aria-labelledby="t d">',
            '<title id="t">GitHub daily contribution activity</title>',
            f'<desc id="d">{total} contributions across {active} active days from {days[0]["date"]} to {days[-1]["date"]}.</desc>',
            f'<rect width="{W}" height="{H}" rx="18" fill="#0d1117"/>',
            '<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">',
            '<text x="82" y="31" fill="#f0f6fc" font-size="21" font-weight="700">Daily activity</text>',
            f'<text x="82" y="53" fill="#8b949e" font-size="12">@{esc(os.environ["USERNAME"])} · {days[0]["date"]} → {days[-1]["date"]} · {total} contributions</text>'
          ]

          for frac,label in ((0,max_count),(0.5,max_count//2),(1,0)):
              y=T+PH*frac
              out.append(f'<line x1="{L}" y1="{y:.1f}" x2="{W-R}" y2="{y:.1f}" stroke="#21262d" stroke-width="1"/>')
              out.append(f'<text x="{L-12}" y="{y+4:.1f}" fill="#8b949e" font-size="11" text-anchor="end">{label}</text>')

          # Month boundaries and labels.
          prev=None
          for i,d in enumerate(days):
              dt=datetime.strptime(d["date"],"%Y-%m-%d")
              key=(dt.year,dt.month)
              x=L+i*slot
              if key!=prev:
                  out.append(f'<line x1="{x:.1f}" y1="{T}" x2="{x:.1f}" y2="{base:.1f}" stroke="#30363d" stroke-width="1" opacity="0.55"/>')
                  out.append(f'<text x="{x+3:.1f}" y="{H-36}" fill="#f0f6fc" font-size="11" font-weight="700">{dt.strftime("%b %Y")}</text>')
                  prev=key

          for i,d in enumerate(days):
              n=d["contributionCount"]
              if n:
                  x=L+i*slot+(slot-bar)/2
                  h=max(2,n/max_count*PH)
                  y=base-h
                  op=0.35+0.65*n/max_count
                  out.append(f'<rect x="{x:.2f}" y="{y:.2f}" width="{bar:.2f}" height="{h:.2f}" fill="#39d353" opacity="{op:.2f}"/>')

          # Date ticks every 14 days, with the final date always shown.
          for i in list(range(0,len(days),14))+[len(days)-1]:
              if i>=len(days): continue
              dt=datetime.strptime(days[i]["date"],"%Y-%m-%d")
              x=L+i*slot+slot/2
              out.append(f'<line x1="{x:.1f}" y1="{base}" x2="{x:.1f}" y2="{base+5}" stroke="#8b949e" stroke-width="1"/>')
              out.append(f'<text x="{x:.1f}" y="{H-13}" fill="#8b949e" font-size="10" text-anchor="middle">{dt.strftime("%d %b")}</text>')

          out.append('</g></svg>')
          os.makedirs("activity-dist",exist_ok=True)
          open("activity-dist/activity-365d.svg","w").write("\n".join(out))

          by_date={date.fromisoformat(d["date"]):d["contributionCount"] for d in days}
          latest=max((d for d in by_date if by_date[d]>0),default=None)
          today=datetime.now(timezone.utc).date()
          current=0
          if latest is not None and (today-latest).days<=1:
              cur=latest
              while by_date.get(cur,0)>0:
                  current+=1
                  cur-=timedelta(days=1)

          longest=run=0
          for d in days:
              if d["contributionCount"]>0:
                  run+=1; longest=max(longest,run)
              else: run=0

          streak=f'''<svg xmlns="http://www.w3.org/2000/svg" width="760" height="190" viewBox="0 0 760 190" role="img" aria-labelledby="st sd">
          <title id="st">GitHub contribution streak</title>
          <desc id="sd">Current streak {current} days. Longest streak {longest} days.</desc>
          <rect width="760" height="190" rx="18" fill="#0d1117"/>
          <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
          <text x="36" y="38" fill="#f0f6fc" font-size="18" font-weight="700">Contribution streak</text>
          <text x="36" y="62" fill="#8b949e" font-size="12">@{esc(os.environ["USERNAME"])} · GitHub contribution calendar</text>
          <text x="44" y="126" fill="#39d353" font-size="46" font-weight="800">{current}</text>
          <text x="132" y="116" fill="#f0f6fc" font-size="15" font-weight="700">current streak</text>
          <text x="132" y="138" fill="#8b949e" font-size="12">consecutive active days</text>
          <line x1="378" y1="82" x2="378" y2="154" stroke="#30363d"/>
          <text x="420" y="126" fill="#f0f6fc" font-size="34" font-weight="800">{longest}</text>
          <text x="486" y="116" fill="#f0f6fc" font-size="15" font-weight="700">longest</text>
          <text x="486" y="138" fill="#8b949e" font-size="12">in the displayed year</text>
          </g></svg>'''
          open("activity-dist/streak.svg","w").write(streak)
          PY

      - name: Publish
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          temp_dir="$(mktemp -d)"
          cp -a activity-dist/. "$temp_dir"/
          git switch --orphan activity-assets
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$temp_dir"/. .
          git add -A
          git commit -m "chore: refresh activity charts"
          git push --force origin activity-assets
